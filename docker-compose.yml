version: "3.9"

services:
  api:
    build: .
    container_name: fabio_api
    ports:
      - "8000:8000"
    depends_on:
      - mongo
    environment:
      - MONGO_URL=mongodb://mongo:27017
    restart: always

  mongo:
    image: mongo
    container_name: fabio_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

  ollama:
    image: ollama/ollama
    container_name: fabio_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: always

volumes:
  mongo_data:
  ollama_data: